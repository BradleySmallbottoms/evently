packages:
  - 'apps/*'
  - 'packages/*'
  - 'infra'

# Packages allowed to run install scripts (pnpm blocks build scripts by default).
allowBuilds:
  esbuild: true
  # Added for the Next.js apps (create-next-app puts these in a nested file you should delete).
  sharp: false
  unrs-resolver: false
  # Pulled in by next-intl / tooling when scaffolding frontends.
  '@swc/core': true
  '@parcel/watcher': true
  argon2: true
  '@sentry/cli': true
  # eas-cli optional natives. The CLI runs without their install scripts.
  dtrace-provider: false
  protobufjs: false

minimumReleaseAgeExclude:
  - expo-dev-client@57.0.20 || 58.0.17
  - expo-dev-launcher@57.0.21 || 58.0.17
  - expo-dev-menu@57.0.20
  - expo-updates@57.0.26 || 58.0.19
  - '@expo/cli@58.1.17'
  - '@expo/config-plugins@58.0.11'
  - '@expo/config@58.0.9'
  - '@expo/image-utils@0.12.6'
  - '@expo/inline-modules@0.2.8'
  - '@expo/local-build-cache-provider@58.0.9'
  - '@expo/metro-config@58.0.19'
  - '@expo/modules-macros-linux-arm64@0.27.1'
  - '@expo/modules-macros-linux-x64@0.27.1'
  - '@expo/modules-macros-win32-arm64@0.27.1'
  - '@expo/modules-macros-win32-x64@0.27.1'
  - '@expo/prebuild-config@58.0.17'
  - '@expo/require-utils@58.0.5'
  - '@expo/router-server@58.0.19'
  - babel-preset-expo@58.0.22
  - expo-asset@58.0.19
  - expo-constants@58.0.14
  - expo-file-system@58.0.13
  - expo-font@58.0.11
  - expo-modules-autolinking@58.0.16
  - expo-modules-cli@0.4.0
