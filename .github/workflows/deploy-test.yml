name: Deploy test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, test]
    steps:
      - name: Update and start
        run: |
          set -eu
          cd /path/to/evnt
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          sh deploy/test/up.sh
