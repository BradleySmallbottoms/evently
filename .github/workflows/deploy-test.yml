name: Deploy test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @local-events/infra synth -c env=dev

  deploy:
    needs: check
    runs-on: [self-hosted, test]
    steps:
      - name: Update and start
        run: |
          set -eu
          cd /home/ubuntu/evently
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          sh deploy/test/up.sh
