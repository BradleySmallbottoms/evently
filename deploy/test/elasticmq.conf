# ElasticMQ on the test server. Clients use the compose DNS name, not the host port.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  domain-events {
    defaultVisibilityTimeout = 60 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "domain-events-dlq"
      maxReceiveCount = 5
    }
  }
  domain-events-dlq {
    defaultVisibilityTimeout = 60 seconds
  }
}
