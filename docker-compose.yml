# Local dependencies: PostgreSQL + PostGIS, Valkey, ElasticMQ (SQS), and Garage (S3).
# Official postgis/postgis is amd64-only; imresamu/postgis is the multi-arch mirror
# (arm64 Macs included). Same tags as postgis/postgis — bump together when updating.
#
# Published host ports are offset (prefix 1) so this stack can run next to other
# Postgres, Valkey, and app processes. Containers still listen on the image default.
services:
  postgres:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
      POSTGRES_DB: events
    ports:
      - '15432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Disposable Playwright DB (same instance; not used by pnpm dev).
      - ./infra/local/02-e2e-db.sh:/docker-entrypoint-initdb.d/02-e2e-db.sh:ro
  valkey:
    image: valkey/valkey:8
    ports:
      - '16379:6379'
  # SQS stand-in for domain events (+ DLQ). Same AWS SDK clients as prod; point
  # DOMAIN_EVENTS_QUEUE_URL + AWS_ENDPOINT_URL_SQS at this host (see .env.example).
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.12
    ports:
      - '19324:9324' # SQS API
      - '19325:9325' # stats / queue UI
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro
  # S3 stand-in for public event images. Same AWS SDK client as prod; S3_ENDPOINT
  # points here (see .env.example). Keys below are local-only, like the Postgres password.
  # After the first start, allow anonymous website reads:
  #   docker compose exec garage /garage bucket website --allow local-events-assets
  garage:
    image: dxflrs/garage:v2.4.1
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK11111111111111111111111111111111
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: local-events-assets
    ports:
      - '13900:3900' # S3 API
      - '13902:3902' # website (http://local-events-assets.localhost:13902)
    volumes:
      - ./infra/local/garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage
  # Browse local buckets. Talks to Garage's admin API on the compose network.
  # http://localhost:13909
  garage-webui:
    image: khairul169/garage-webui:1.1.0
    depends_on:
      - garage
    ports:
      - '13909:3909'
    volumes:
      - ./infra/local/garage.toml:/etc/garage.toml:ro
    environment:
      API_BASE_URL: http://garage:3903
      API_ADMIN_KEY: local-dev-admin-token
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: garage
volumes:
  pgdata:
  garagedata:
