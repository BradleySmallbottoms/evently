include classpath("application.conf")

# port is the host port clients use (docker publishes 19324 -> bind-port 9324).
node-address {
  protocol = http
  host = localhost
  port = 19324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  # Mirrors infra/lib/data-stack.ts DomainEvents (+ DLQ).
  domain-events {
    defaultVisibilityTimeout = 60 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "domain-events-dlq"
      maxReceiveCount = 5
    }
  }
  domain-events-dlq {
    defaultVisibilityTimeout = 60 seconds
  }
}
